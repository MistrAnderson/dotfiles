[config]

[templates.hyprland]
input_path = '~/dotfiles/matugen/templates/hyprland-colors.conf'
output_path = '~/dotfiles/hypr/colors.conf'
post_hook = 'hyprctl reload'

[templates.waybar]
input_path = '~/dotfiles/matugen/templates/colors.css'
output_path = '~/dotfiles/waybar/colors.css'

[templates.kitty]
input_path = '~/dotfiles/matugen/templates/kitty-colors.conf'
output_path = '~/dotfiles/kitty/colors.conf'
post_hook = "kitty @ set-colors -a -c ~/.config/kitty/colors.conf"

[templates.gtk3]
input_path = '~/dotfiles/matugen/templates/gtk-colors.css'
output_path = '~/dotfiles/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/dotfiles/matugen/templates/gtk-colors.css'
output_path = '~/dotfiles/gtk-4.0/colors.css'
